name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: khub
          POSTGRES_USER: khub
          POSTGRES_PASSWORD: khub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khub -d khub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
          - 6334:6334
    # Service containers above are configured to match backend/app/core/config.py's
    # own Settings defaults (localhost:5432 khub/khub/khub, localhost:6379,
    # localhost:6333) so no DATABASE_URL/REDIS_URL/... overrides are needed here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app

      # test_full_sync_to_chat_flow.py loads the real embedding model even
      # under `-m "not slow"` (only test_embedding_provider_contract.py is
      # marked slow) -- cache it so repeat CI runs don't re-download it.
      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-bge-small-en-v1.5

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Test
        working-directory: backend
        run: pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      # Added once frontend/package.json has a "test" script (see the
      # production-hardening plan's test-gap-closing item).
      # - name: Test
      #   working-directory: frontend
      #   run: npm run test
